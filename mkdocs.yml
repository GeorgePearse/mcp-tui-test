site_name: MCP TUI Test
site_description: Like Playwright, but for Terminal User Interfaces
site_author: MCP TUI Test Contributors
site_url: https://georgepearse.github.io/mcp-tui-test/

repo_name: GeorgePearse/mcp-tui-test
repo_url: https://github.com/GeorgePearse/mcp-tui-test

# Match the documentation style used by VisionChain and bayesian_filters.
theme:
  name: material
  language: en
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy

plugins:
  - search
  - offline:
      enabled: !ENV [MKDOCS_OFFLINE, false]  # Opt-in file:// builds; preserve public URLs by default
  - git-revision-date-localized

markdown_extensions:
  - attr_list
  - def_list
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - admonition
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Examples: examples.md
  - Codemode: codemode.md

copyright: Copyright &copy; 2025 MCP TUI Test Contributors
